version: 2
updates:
  # Maintain Cargo dependencies (crates)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Block all breaking (major) version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Automatically bundles non-breaking patch bumps into 1 PR
      patch-updates:
        update-types:
          - "patch"

      # Keep UI-related crates together
      tui-crates:
        patterns:
          - "ratatui"
          - "tui-input"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Block all breaking (major) version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
